<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<!-- no network: the page cannot load or send anything -->
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src data:">
<title>VDS Planner</title>
<style>
:root{
  --bg:#f4f5f7; --panel:#fff; --ink:#1b1c1e; --muted:#62656b; --line:#d7d9dd; --soft:#eef0f2;
  --accent:#005C8A; --accent-soft:#e1edf4; --ok:#2e7d4f; --ok-soft:#e2f2e8; --warn:#9a6a00; --warn-soft:#fbf0d4;
  --bad:#a63a32; --bad-soft:#f8e3e1; --vmk:#6a4c93; --vmk-soft:#efe8f7;
  --sans:system-ui,-apple-system,"Segoe UI",sans-serif; --mono:ui-monospace,Consolas,Menlo,monospace;
}
/* theme: system (default), light or dark (View menu) */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#16171a; --panel:#1f2125; --ink:#e7e8ea; --muted:#9a9ea6; --line:#363a41; --soft:#2a2d33;
  --accent:#7fb0e0; --accent-soft:#22344a; --ok:#6cc495; --ok-soft:#1d3428; --warn:#e0b450; --warn-soft:#3a3018;
  --bad:#ec8a80; --bad-soft:#3d2220; --vmk:#c3a6ea; --vmk-soft:#2f2640;
  color-scheme:dark; --brand-word:var(--brand-word-dark);
}}
:root[data-theme=dark]{
  --bg:#16171a; --panel:#1f2125; --ink:#e7e8ea; --muted:#9a9ea6; --line:#363a41; --soft:#2a2d33;
  --accent:#7fb0e0; --accent-soft:#22344a; --ok:#6cc495; --ok-soft:#1d3428; --warn:#e0b450; --warn-soft:#3a3018;
  --bad:#ec8a80; --bad-soft:#3d2220; --vmk:#c3a6ea; --vmk-soft:#2f2640;
  color-scheme:dark; --brand-word:var(--brand-word-dark);
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font:13.5px/1.5 var(--sans)}
header{display:flex;flex-wrap:wrap;align-items:center;gap:6px 10px;padding:6px 16px;background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0 8px 0 0}
header label{font-size:12px;color:var(--muted);display:flex;align-items:center;gap:6px}
header .spacer{flex:1}
input[type=text],input[type=number],select{padding:4px 7px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);font:13px var(--sans);min-width:0}
.wide{width:100%}
input.bad{border-color:var(--bad);background:var(--bad-soft)}
.btn{padding:5px 11px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink);cursor:pointer;font-size:12.5px;white-space:nowrap}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.small{padding:2px 8px;font-size:12px}
.btn:disabled{opacity:.45;cursor:not-allowed}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .btn.pri{color:#10151b}}
:root[data-theme=dark] .btn.pri{color:#10151b}
.tabs{display:flex;align-items:flex-end;gap:2px;padding:8px 16px 0;border-bottom:1px solid var(--line);overflow-x:auto;background:var(--bg)}
.tab{padding:6px 12px;border:1px solid var(--line);border-bottom:none;border-radius:6px 6px 0 0;background:var(--soft);cursor:pointer;font-size:13px;white-space:nowrap;color:var(--ink)}
.tab.on{background:var(--panel);font-weight:600;position:relative;top:1px}
.tab.env{font-style:italic}
.tabs .tools{margin-left:auto;display:flex;gap:4px;padding-bottom:4px}
.tag{display:inline-block;font:11px/1.6 var(--mono);padding:0 7px;border-radius:10px;border:1px solid currentColor;white-space:nowrap;margin-left:4px}
.t-ok{color:var(--ok);background:var(--ok-soft)} .t-warn{color:var(--warn);background:var(--warn-soft)}
.t-bad{color:var(--bad);background:var(--bad-soft)} .t-info{color:var(--accent);background:var(--accent-soft)}
.t-vmk{color:var(--vmk);background:var(--vmk-soft)}
main{display:grid;grid-template-columns:270px 1fr 340px;min-height:calc(100vh - 230px);background:var(--panel)}
.col{padding:12px 14px;border-right:1px solid var(--line);overflow:auto}
.col:last-child{border-right:none}
/* the settings panel stays in view next to a long port group list */
#editor{position:sticky;top:var(--gh,0px);align-self:start;max-height:calc(100vh - var(--gh,0px));overflow-y:auto;background:var(--panel)}
/* the inventory list also stays in view, with its own scroll bar */
#inventory{position:sticky;top:var(--gh,0px);align-self:start;max-height:calc(100vh - var(--gh,0px));overflow-y:auto;background:var(--panel)}
html{scroll-padding-top:calc(var(--gh,0px) + 8px)}
.lbl{font:11px var(--mono);text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:12px 0 4px}
.lbl:first-child{margin-top:0}
.inv-cl{border:1px solid var(--line);border-radius:7px;margin-bottom:8px}
.inv-cl .hd{padding:5px 9px;background:var(--soft);border-bottom:1px solid var(--line);display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.inv-cl .hd b{flex:1}
.inv-cl .hd small{color:var(--muted)}
.inv-cl .hd select{font-size:12px;padding:1px 4px}
.inv-sw{display:flex;align-items:center;gap:6px;padding:5px 9px;font-size:12.5px}
.inv-sw span{flex:1;min-width:0;overflow-wrap:anywhere}
.inv-sw .btn{flex:none}
.inv-sw small{color:var(--muted);font-family:var(--mono)}
.vds{border:1px solid var(--line);border-radius:8px;margin-bottom:12px}
.vds.sel{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent)}
.vds-h{display:flex;align-items:center;gap:6px 8px;padding:7px 10px;background:var(--soft);border-bottom:1px solid var(--line);flex-wrap:wrap;cursor:pointer}
.vds-h b{font-family:var(--mono)}
.vds-h span.meta{color:var(--muted);font-size:12px}
.vds-h .spacer{flex:1}
.vds-b{padding:8px 10px;display:flex;flex-wrap:wrap;gap:6px}
.pg{border:1px solid var(--line);border-radius:6px;padding:4px 8px;font-size:12.5px;cursor:pointer;background:var(--panel);color:var(--ink);text-align:left}
.pg.sel{border-color:var(--accent);background:var(--accent-soft)}
.pg.off{opacity:.5;text-decoration:line-through}
.pg.new{border-style:dashed}
.pg.vmk{border-color:var(--vmk);color:var(--vmk);background:var(--vmk-soft)}
.pg.vmk.sel{box-shadow:0 0 0 2px var(--vmk)}
.pg small{color:var(--muted);font-family:var(--mono);margin-left:4px}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.ro{font-size:12.5px;color:var(--muted);background:var(--soft);border-radius:5px;padding:5px 8px}
.ul-row{display:flex;align-items:center;gap:8px;margin:3px 0;font-size:12.5px}
.ul-row span{width:80px;font-family:var(--mono)}
.chk{display:flex;align-items:flex-start;gap:6px;font-size:12.5px;margin:6px 0}
.btns{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{background:var(--soft);font-weight:600;white-space:nowrap}
td input{width:100%}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:7px}
footer{border-top:1px solid var(--line);background:var(--panel);padding:10px 16px;display:grid;grid-template-columns:1fr 380px;gap:16px}
.checks{max-height:170px;overflow:auto}
.checks div{display:flex;gap:6px;align-items:baseline;padding:2px 0;font-size:12.5px}
.checks .tag{margin-left:0;min-width:48px;text-align:center}
.commit-box{display:flex;flex-direction:column;gap:6px}
.versions{font-size:12.5px;max-height:110px;overflow:auto}
.versions div{display:flex;align-items:center;gap:6px;padding:2px 0;flex-wrap:wrap}
.versions code{font-family:var(--mono);font-size:11px;color:var(--muted)}
.empty{color:var(--muted);font-size:12.5px;padding:8px 0}
#overview{display:none;background:var(--panel);padding:16px;min-height:calc(100vh - 110px)}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:10px;margin-bottom:14px}
.stat{border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.stat b{display:block;font-size:22px}
.stat span{color:var(--muted);font-size:12px}
.msg{position:fixed;right:16px;bottom:40px;max-width:440px;background:var(--panel);border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:8px;padding:10px 14px;box-shadow:0 4px 16px rgba(0,0,0,.15);display:none;white-space:pre-wrap;font-size:13px;z-index:30}
.msg.on{display:block}
.msg.err{border-left-color:var(--bad)}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
.overlay.on{display:flex}
.dialog{background:var(--panel);border:1px solid var(--line);border-radius:10px;max-width:860px;width:100%;max-height:85vh;overflow:auto;padding:16px 18px;box-shadow:0 8px 30px rgba(0,0,0,.25)}
.dialog h2{font-size:16px;margin:0 0 8px}
.dialog .btns{justify-content:flex-end}
/* VDS topology: port groups, bus and uplinks, like the switch view of the vSphere Client */
:root{--wire:#8a9099;--wire-on:#e07b00}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){--wire:#6b717a;--wire-on:#ffab40}}
:root[data-theme=dark]{--wire:#6b717a;--wire-on:#ffab40}
#draft{overflow:visible;min-width:0}
.inv-sw[draggable]{cursor:grab}
body.dragging #vds-list{outline:2px dashed var(--line);outline-offset:4px;border-radius:8px;min-height:60px}
body.dragging .vds.topo{outline:2px dashed var(--accent);outline-offset:1px}
.drop-on{background:var(--accent-soft)}
.vds.topo.drop-on{outline:3px solid var(--wire-on)}
td.mem-act{border-bottom:1px solid var(--line);padding-top:0}
td.mem-act select{font-size:12px;max-width:220px}
.draft-tools{margin:0 0 10px;align-items:center}
.draft-tools input{flex:1;min-width:160px}
.vds.topo .vds-h span.meta{flex:1 1 140px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.vds.topo .vds-h .spacer{display:none}
.vds.topo .vds-h{position:sticky;top:var(--gh,0px);z-index:3;border-radius:7px 7px 0 0;box-shadow:0 3px 6px -3px rgba(0,0,0,.25)}
.fold{border:none;background:none;color:var(--ink);cursor:pointer;font-size:13px;padding:0 4px;line-height:1}
.topo-b{display:grid;grid-template-columns:minmax(0,1fr) 26px minmax(170px,230px);padding:12px 10px 12px 12px}
.pgs{border-right:2px solid var(--wire);display:flex;flex-direction:column;gap:6px;padding:4px 0;grid-column:1}
/* the browser skips the layout of rows out of view: a large vCenter has thousands of port groups */
.pgrow{display:flex;align-items:center;content-visibility:auto;contain-intrinsic-size:auto 46px}
.wire{flex:1;min-width:14px;border-top:2px solid var(--wire)}
.pgrow.on .wire{border-top-color:var(--wire-on)}
.pgbox{flex:0 1 auto;width:100%;max-width:440px;border:1px solid var(--line);border-left:4px solid var(--accent);border-radius:6px;padding:5px 9px;background:var(--panel);cursor:pointer;font-size:12.5px}
.pgbox:hover{border-color:var(--accent)}
.pgbox:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.pgbox.sel{border-color:var(--wire-on);border-left-color:var(--wire-on);box-shadow:0 0 0 1px var(--wire-on);background:var(--accent-soft)}
.pgbox.off{opacity:.55}
.pgbox.off .pgn{text-decoration:line-through}
.pgbox.new{border-style:dashed;border-left-style:solid}
.pgbox.vmkonly{border-left-color:var(--vmk)}
.pgn{font-weight:600;display:flex;align-items:center;gap:4px;flex-wrap:wrap;word-break:break-word}
.pgn .tag{margin-left:2px}
.pgm{color:var(--muted);font-size:11.5px;font-family:var(--mono)}
.pgk{font-size:11.5px;color:var(--vmk);margin-top:2px}
.pgk.new{cursor:pointer;border-radius:4px;padding:1px 4px;background:var(--vmk-soft)}
.pgk.new.sel{box-shadow:0 0 0 2px var(--vmk)}
.ico-pg,.ico-up{display:inline-block;width:12px;height:10px;border:2px solid currentColor;border-radius:2px;margin-right:3px;flex:none;opacity:.7}
.ico-up{border-radius:50%;width:11px;height:11px}
.ups{grid-column:3;position:relative}
/* below the VDS name bar: --vhh is the height of that bar, set after each render */
.upbox{position:sticky;top:calc(var(--gh,0px) + var(--vhh,44px) + 8px);border:1px solid var(--line);border-left:4px solid var(--ok);border-radius:6px;background:var(--panel);font-size:12.5px}
.upbox::before{content:'';position:absolute;left:-30px;top:15px;width:26px;border-top:2px solid var(--wire)}
.uph{font-weight:600;padding:5px 9px;border-bottom:1px solid var(--line);background:var(--soft);display:flex;align-items:center}
.uprow{display:flex;flex-wrap:wrap;align-items:center;gap:2px 6px;padding:4px 9px;border-left:3px solid transparent}
.uprow + .uprow{border-top:1px solid var(--line)}
.uprow .upn{font-family:var(--mono);font-weight:600}
.uprow small{flex-basis:100%;color:var(--muted);font-family:var(--mono);font-size:11px;word-break:break-word}
.uprow.act{border-left-color:var(--wire-on);background:var(--accent-soft)}
.uprow.stb{border-left:3px dashed var(--wire-on)}
.uprow.unu{opacity:.55}
.uphosts{border-top:1px solid var(--line);padding:4px 9px;font-size:11.5px}
.uphosts summary{cursor:pointer;color:var(--accent)}
.uphosts table{font-size:11px;margin-top:4px}
.uphosts td,.uphosts th{padding:2px 4px;font-family:var(--mono)}
.uphosts p{margin:4px 0 0;font-size:11px}
@media (max-width:700px){.topo-b{grid-template-columns:1fr}.pgs{border-right:none}.wire{display:none}.ups{grid-column:1;margin-top:10px}.upbox::before{display:none}.upbox{position:static}}
/* menu bar, like a desktop application: File, Edit, Draft, View, Tools, Help */
.brand{display:flex;align-items:center;gap:7px;font-weight:700;font-size:15px;margin-right:6px;white-space:nowrap}
.brand i{width:18px;height:18px;border-radius:50%;background:var(--brand-mark) center/contain no-repeat;display:inline-block}
:root.no-brand .brand i{background:linear-gradient(135deg,var(--accent),var(--ok));border-radius:5px}
/* the pulse mark as a watermark: fixed, very light, under the menus and dialogs, no effect on clicks */
body::after{content:'';position:fixed;right:-70px;bottom:-60px;width:min(46vw,540px);aspect-ratio:1;background:var(--brand-mark-big) center/contain no-repeat;opacity:.035;pointer-events:none;z-index:13}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) body::after{opacity:.05}}
:root[data-theme=dark] body::after{opacity:.05}
:root.no-brand body::after{display:none}
.brandword{display:inline-block;height:11px;width:81px;background:var(--brand-word) left center/contain no-repeat;opacity:.55;vertical-align:-1px}
.start .brandword{height:22px;width:162px;opacity:.75;margin-bottom:6px}
.dialog .brandword{height:18px;width:133px;opacity:.85}
:root.no-brand .brandword{display:none}
.menubar{display:flex;gap:1px;align-items:center}
.menu{position:relative}
.mtop{background:none;border:1px solid transparent;border-radius:5px;padding:3px 9px;font-size:13px;color:var(--ink);cursor:pointer}
.mtop:hover,.menu.open .mtop,.mtop:focus-visible{background:var(--soft);border-color:var(--line);outline:none}
.mdrop{display:none;position:absolute;left:0;top:calc(100% + 3px);min-width:270px;max-height:calc(100vh - 80px);overflow-y:auto;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 10px 28px rgba(0,0,0,.2);padding:4px;z-index:45}
.menu.open .mdrop{display:block}
.mi{display:flex;width:100%;align-items:center;gap:10px;padding:5px 10px;border:none;background:none;border-radius:5px;font-size:13px;color:var(--ink);cursor:pointer;text-align:left;white-space:nowrap}
.mi:hover:not(:disabled),.mi:focus-visible{background:var(--accent-soft);outline:none}
.mi:disabled{opacity:.4;cursor:default}
.mi .ck{width:14px;flex:none;text-align:center}
.mi .k{margin-left:auto;padding-left:18px;color:var(--muted);font:11.5px var(--mono)}
.msep{height:1px;background:var(--line);margin:4px 6px}
.mlbl{font:10.5px var(--mono);color:var(--muted);padding:6px 10px 2px;text-transform:uppercase;letter-spacing:.05em}
.toolbar{display:flex;gap:4px;align-items:center}
.toolbar .btn{padding:3px 9px}
/* status bar */
.statusbar{position:fixed;left:0;right:0;bottom:0;z-index:14;display:flex;gap:4px 16px;flex-wrap:wrap;align-items:center;padding:3px 16px;background:var(--soft);border-top:1px solid var(--line);font-size:11.5px;color:var(--muted)}
.statusbar b{color:var(--ink);font-weight:600}
.statusbar .sp{flex:1}
.statusbar .dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px;background:var(--ok)}
.statusbar .dot.dirty{background:var(--warn)}
body{padding-bottom:28px}
/* start screen */
.start{max-width:980px;margin:10px auto 30px}
.start h2{font-size:22px;margin:4px 0 2px}
.start .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px;margin:16px 0}
.start .card{border:1px solid var(--line);border-radius:10px;padding:14px 16px;background:var(--panel);cursor:pointer;text-align:left;color:var(--ink);font-size:13px}
.start .card:hover,.start .card:focus-visible{border-color:var(--accent);box-shadow:0 0 0 1px var(--accent);outline:none}
.start .card b{display:block;font-size:15px;margin-bottom:4px}
.start .card small{color:var(--muted)}
.start .recent div{display:flex;gap:10px;align-items:center;padding:5px 0;border-bottom:1px solid var(--line)}
.start .recent button.link{background:none;border:none;color:var(--accent);cursor:pointer;font-size:13.5px;padding:0;text-align:left}
.kbd{font:11.5px var(--mono);border:1px solid var(--line);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--soft)}
.form{display:grid;grid-template-columns:200px 1fr;gap:8px 14px;align-items:center;margin:10px 0}
.form label{font-size:12.5px;color:var(--muted)}
.form textarea{font:13px var(--sans);padding:5px 7px;border:1px solid var(--line);border-radius:5px;background:var(--panel);color:var(--ink);resize:vertical;width:100%}
.form .help{grid-column:2;font-size:11.5px;color:var(--muted);margin-top:-4px}
@media (max-width:640px){.form{grid-template-columns:1fr}.form .help{grid-column:1}}
/* guide bar: progress, next action and the commit button stay at the top of the window */
.topbar{position:sticky;top:0;z-index:16;border-top:2px solid var(--brand-red)}
:root.no-brand .topbar{border-top-color:transparent}
.guide{display:flex;align-items:center;gap:6px 12px;flex-wrap:wrap;padding:7px 16px;background:var(--panel);border-bottom:1px solid var(--line);box-shadow:0 2px 6px rgba(0,0,0,.07)}
.steps{display:flex;gap:4px;flex-wrap:wrap}
.step{display:inline-flex;align-items:center;gap:5px;padding:2px 9px 2px 3px;border:1px solid var(--line);border-radius:14px;background:var(--soft);font-size:12px;cursor:pointer;color:var(--ink)}
.step i{font-style:normal;width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;font:600 10.5px var(--sans);background:var(--panel);border:1px solid var(--line)}
.step.done i{background:var(--ok);border-color:var(--ok);color:#fff}
.step.now{border-color:var(--accent);background:var(--accent-soft);font-weight:600}
.step.now i{background:var(--accent);border-color:var(--accent);color:#fff}
.next{flex:1;min-width:240px;display:flex;align-items:center;gap:8px;font-size:12.5px}
.next b{color:var(--accent)}
.btn.big{padding:6px 16px;font-size:13.5px;font-weight:600}
.btn.wait{background:var(--soft);border-color:var(--bad);color:var(--bad)}
.pulse{animation:pulse 1.1s ease-out 3}
@keyframes pulse{0%{box-shadow:0 0 0 0 rgba(47,93,138,.7)}100%{box-shadow:0 0 0 12px rgba(47,93,138,0)}}
/* help bubble: shows when the pointer is on a control, goes when it moves away */
.tip{position:fixed;z-index:50;max-width:330px;padding:7px 10px;border-radius:8px;background:rgba(27,28,30,.86);color:#fff;font-size:12.5px;line-height:1.45;pointer-events:none;opacity:0;transition:opacity .15s;left:-999px;top:-999px;box-shadow:0 4px 14px rgba(0,0,0,.2)}
.tip.on{opacity:1}
.tip .nx{margin-top:4px;color:#a9d1ff;font-weight:600}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]) .tip{background:rgba(236,238,241,.93);color:#1b1c1e}:root:not([data-theme=light]) .tip .nx{color:#2f5d8a}}
:root[data-theme=dark] .tip{background:rgba(236,238,241,.93);color:#1b1c1e}:root[data-theme=dark] .tip .nx{color:#2f5d8a}
/* tour: a spotlight on one part of the page and a coach bubble */
.spot{position:fixed;z-index:40;border-radius:8px;box-shadow:0 0 0 9999px rgba(0,0,0,.5);pointer-events:none;display:none}
.spot.on{display:block}
.coach{position:fixed;z-index:45;width:340px;max-width:calc(100vw - 16px);background:var(--panel);border:1px solid var(--accent);border-radius:10px;padding:12px 14px;box-shadow:0 8px 30px rgba(0,0,0,.3);display:none}
.coach.on{display:block}
.coach .ct{font:11px var(--mono);color:var(--muted)}
.coach b{display:block;font-size:14px;margin:2px 0 4px}
.coach p{margin:0;font-size:13px}
.coach .btns{justify-content:flex-end;margin-top:10px}
.done-box{border:1px solid var(--ok);background:var(--ok-soft);color:var(--ink);border-radius:8px;padding:8px 12px;margin:6px 0}
.cmd{border:1px solid var(--line);border-radius:7px;padding:7px 10px;margin:6px 0}
.cmd .cl{font-weight:600;font-size:12.5px}
.cmd .cr{display:flex;align-items:center;gap:8px;margin:4px 0 2px}
.cmd code,pre.code{font:12px var(--mono);background:var(--soft);padding:3px 7px;border-radius:4px;flex:1;overflow-x:auto;white-space:pre}
pre.code{display:block;max-height:55vh;overflow:auto;padding:8px 10px;margin:8px 0}
.m{color:var(--muted)}
ol.howto li{margin:4px 0}
@media (max-width:1050px){main{grid-template-columns:1fr}.col{border-right:none;border-bottom:1px solid var(--line)}footer{grid-template-columns:1fr}#editor,#inventory{position:static;max-height:none}}
</style>
</head>
<body>
<div class="topbar" id="topbar">
<header>
  <span class="brand"><i aria-hidden="true"></i>VDS Planner</span>
  <nav class="menubar" id="menubar" role="menubar" aria-label="Main menu"></nav>
  <span class="toolbar" role="toolbar" aria-label="Quick actions">
    <button class="btn" data-act="open-project">Open</button>
    <button class="btn" data-act="save-project">Save</button>
    <button class="btn" data-act="import">Import inventory</button>
  </span>
  <span class="spacer"></span>
  <label>vCenter <input type="text" id="vcenter" placeholder="vc01.example.local" size="20"></label>
  <label>Site <input type="text" id="site" placeholder="Site A" size="10"></label>
  <button class="btn" data-act="help">? Help</button>
  <input type="file" id="f-project" accept=".json" hidden>
  <input type="file" id="f-inventory" accept=".xlsx,.csv" multiple hidden>
  <input type="file" id="f-ipplan" accept=".csv" hidden>
</header>
<div class="guide" id="guide"></div>
</div>
<nav class="tabs" id="tabs"></nav>
<section id="overview"></section>
<main id="work">
  <section class="col" id="inventory"></section>
  <section class="col" id="draft"></section>
  <section class="col" id="editor"></section>
</main>
<footer id="foot">
  <div><div class="lbl">Checks for this draft</div><div class="checks" id="checks"></div></div>
  <div class="commit-box">
    <div class="lbl">Commit</div>
    <input type="text" class="wide" id="committer" placeholder="Your name (recorded in the plan)">
    <button class="btn pri" data-act="commit" id="btn-commit">Commit and generate package</button>
    <div class="versions" id="versions"></div>
  </div>
</footer>
<div class="overlay" id="overlay"><div class="dialog" id="dialog"></div></div>
<div class="msg" id="msg" role="status" aria-live="polite"></div>
<div class="statusbar" id="statusbar" role="status"></div>
<div class="tip" id="tip" role="tooltip"></div>
<div class="spot" id="spot"></div>
<div class="coach" id="coach" role="dialog" aria-label="Tour"></div>

<script>
(() => {
  'use strict';
  const $ = s => document.querySelector(s);
  const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const LB = [['LoadBalanceSrcId', 'Route based on originating virtual port'], ['LoadBalanceSrcMac', 'Route based on source MAC hash'],
    ['LoadBalanceIP', 'Route based on IP hash'], ['LoadBalanceLoadBased', 'Route based on physical NIC load'], ['ExplicitFailover', 'Use explicit failover order']];
  const ZONES = ['', 'Internal', 'DMZ', 'Management', 'Backup', 'Other'];
  const SERVICES = ['vMotion', 'Provisioning', 'Management', 'vSAN', 'FaultTolerance', 'Replication', 'NfcReplication'];
  const STACKS = { defaultTcpipStack: 'Default', vmotion: 'vMotion', vSphereProvisioning: 'Provisioning' };
  const STACK_FOR = { vmotion: 'vMotion', vSphereProvisioning: 'Provisioning' };
  // default VMkernel MTU: jumbo frames for vMotion and Provisioning, 1500 for the other services
  const vmkMtuFor = s => (s === 'vMotion' || s === 'Provisioning') ? 9000 : 1500;

  let P, cur = -1, sel = null, dirty = false, projectHandle = null, dialogOk = null, captureFiles = null, lastCk = [];

  const newDraft = n => ({ id: 'd' + Date.now().toString(36) + n, name: 'Draft ' + n, vds: [], versions: [] });
  // file formats. An earlier identifier had a prefix before 'vdsplan': the planner and the scripts still read it.
  const FORMAT_PROJECT = 'vdsplan-project/1', FORMAT_PLAN = 'vdsplan-run/1';
  const isProjectFormat = f => /^(?:[a-z0-9]+-)?vdsplan-project\/1$/.test(f || '');
  const newProject = () => ({ format: FORMAT_PROJECT, vcenter: '', site: '',
    settings: { toolkitPath: 'C:\\Tools\\vds-toolkit', userName: 'administrator@vsphere.local', vdsVersion: '8.0.3', ports: 8 },
    inventory: { clusters: {}, history: [], existing: [] }, drafts: [newDraft(1)] });
  const draft = () => P.drafts[cur];
  // quiet: one render after a batch of changes, not one for each change
  let quiet = false;
  const touch = () => { dirty = true; if (!quiet) { snap(); render(); scheduleRecovery(); } };
  const slug = s => String(s).replace(/[^\w-]+/g, '-').replace(/^-+|-+$/g, '').toLowerCase() || 'draft';
  const uplinkNames = n => Array.from({ length: n }, (_, i) => 'dvUplink' + (i + 1));
  const clone = o => JSON.parse(JSON.stringify(o));
  const clustersOf = v => v.members.map(m => m.cluster);
  function say(text, err) {
    const m = $('#msg'); m.textContent = text; m.className = 'msg on' + (err ? ' err' : '');
    clearTimeout(say.t); say.t = setTimeout(() => { m.className = 'msg'; }, err ? 9000 : 5000);
  }
  function openDialog(html, ok) { $('#dialog').innerHTML = html; $('#overlay').classList.add('on'); dialogOk = ok || null; }
  function closeDialog() { $('#overlay').classList.remove('on'); dialogOk = null; }

  // older project files: add the fields of later versions
  function normalize(o) {
    o.format = FORMAT_PROJECT;
    o.settings = Object.assign({ toolkitPath: 'C:\\Tools\\vds-toolkit', userName: 'administrator@vsphere.local', vdsVersion: '8.0.3', ports: 8 }, o.settings || {});
    o.inventory = o.inventory || { clusters: {} };
    o.inventory.history = o.inventory.history || [];
    o.inventory.existing = o.inventory.existing || [];
    Object.values(o.inventory.clusters).forEach(x => { x.rows = x.rows || []; x.hosts = x.hosts || []; x.zone = x.zone || ''; });
    (o.drafts || []).forEach(d => {
      d.versions = d.versions || [];
      d.vds.forEach(v => {
        if (!v.members) {
          const c = (v.clusters || [])[0], inv = o.inventory.clusters[c];
          const r = inv && inv.rows.find(x => x.Switch === v.sourceSwitch);
          v.members = [{ cluster: c, newVds: r ? r.NewVds : v.name, sourceSwitch: v.sourceSwitch, uplinks: v.sourceUplinks || '', deviating: v.deviating || '' }];
        }
        v.vmkernel = v.vmkernel || [];
        v.portGroups.forEach(p => { p.flags = p.flags || ''; });
      });
    });
    return o;
  }

  // ---------- inventory: fixed input from Export-VssLayout.ps1 ----------
  function parseCsv(text, sep) {
    const rows = []; let row = [], f = '', q = false;
    text = text.replace(/^\ufeff/, ''); sep = sep || ',';
    for (let i = 0; i < text.length; i++) {
      const c = text[i];
      if (q) { if (c === '"') { if (text[i + 1] === '"') { f += '"'; i++; } else q = false; } else f += c; }
      else if (c === '"') q = true;
      else if (c === sep) { row.push(f); f = ''; }
      else if (c === '\n' || c === '\r') {
        if (c === '\r' && text[i + 1] === '\n') i++;
        row.push(f); f = ''; if (row.length > 1 || row[0] !== '') rows.push(row); row = [];
      } else f += c;
    }
    if (f !== '' || row.length) { row.push(f); rows.push(row); }
    if (!rows.length) return [];
    const head = rows.shift();
    return rows.map(r => Object.fromEntries(head.map((h, k) => [h, r[k] == null ? '' : r[k]])));
  }
  const sanitize = s => String(s).replace(/[^\w-]/g, '_');
  async function importFiles(fileList) {
    const files = [...fileList], inc = {}, bad = [], skipped = [], existingFiles = [];
    let existing = null;
    const add = (c, kind, rows, file) => { inc[c] = inc[c] || { file: [] }; inc[c][kind] = (inc[c][kind] || []).concat(rows); inc[c].file.push(file); };
    const fromFile = name => {
      const base = name.replace(/(\.sample)?\.csv$/i, '').replace(/_hosts$/i, '');
      const known = Object.keys(P.inventory.clusters).concat(Object.keys(inc));
      return known.find(k => sanitize(k) === base) || base;
    };
    // an inventory workbook, or CSV exports of its sheets, go to the workbook import
    const parsed = [], books = [], sheetFiles = [];
    for (const f of files) {
      if (/\.xlsx$/i.test(f.name)) { books.push(f); continue; }
      const rows = parseDelimited(await f.text()), h = rows[0] || {}, head = Object.keys(h);
      const planner = 'NewVds' in h || ('Host' in h && 'Uplinks' in h) || ('Vds' in h && 'PortGroup' in h) || ('PortGroup' in h && 'Vmk' in h);
      const kind = planner ? null : wbKind(f.name, head);
      if (kind) sheetFiles.push([f, kind, rows]); else parsed.push([f, rows]);
    }
    if (books.length || sheetFiles.length) { await importWorkbook(books, sheetFiles, files.map(f => f.name)); return; }
    // the vdsplan files first, so that a hosts file with no Cluster column finds its cluster
    parsed.sort((a, b) => ('NewVds' in (b[1][0] || {})) - ('NewVds' in (a[1][0] || {})));
    for (const [f, rows] of parsed) {
      const h = rows[0] || {};
      if ('NewVds' in h && 'Cluster' in h) {
        const by = {}; rows.forEach(r => (by[r.Cluster] = by[r.Cluster] || []).push(r));
        Object.keys(by).forEach(c => add(c, 'rows', by[c], f.name));
      } else if ('Host' in h && 'Uplinks' in h && 'SpeedMbps' in h) {
        const by = {}; rows.forEach(r => { const c = r.Cluster || fromFile(f.name); (by[c] = by[c] || []).push(r); });
        Object.keys(by).forEach(c => add(c, 'hosts', by[c], f.name));
      } else if ('Vds' in h && 'PortGroup' in h && 'Datacenter' in h) {
        existing = (existing || []).concat(rows.map(r => ({ Datacenter: r.Datacenter, Vds: r.Vds, PortGroup: r.PortGroup, Vlan: r.Vlan })));
        existingFiles.push(f.name);
      } else if ('PortGroup' in h && 'Vmk' in h) skipped.push(f.name);
      else bad.push(f.name);
    }
    const note = (bad.length ? '\nNot an inventory file: ' + bad.join(', ') : '') +
      (skipped.length ? '\nNot necessary (port group detail): ' + skipped.join(', ') : '');
    applyInventory(inc, existing, existingFiles, files.map(f => f.name), note, bad.length > 0);
  }
  function applyInventory(inc, existing, existingFiles, fileNames, note, warn) {
    const changes = [];
    Object.keys(inc).forEach(c => {
      const old = P.inventory.clusters[c], n = inc[c];
      if (!old) { changes.push([c, 'added', 'New cluster', '']); return; }
      if (n.rows) diffRows(old.rows, n.rows, r => r.NewVds + ' / ' + r.PortGroup,
        ['Datacenter', 'Vlan', 'StandardUplinks', 'DeviatingHosts', 'HostsWithPortGroup', 'HostsWithSwitch', 'Flags']).forEach(x => changes.push([c].concat(x)));
      if (n.hosts) diffRows(old.hosts, n.hosts, r => r.Host + ' / ' + r.Switch, ['Datacenter', 'EsxVersion', 'Uplinks', 'UplinkCount', 'SpeedMbps', 'Mtu']).forEach(x => changes.push([c].concat(x)));
    });
    if (existing) {
      P.inventory.existing = existing; dirty = true; snap();
      if (!Object.keys(inc).length) { render(); say('Existing VDS imported: ' + existing.length + ' port groups from ' + existingFiles.join(', ') + '.' + note); return; }
    }
    if (!Object.keys(inc).length) { say('No inventory imported.' + note, true); return; }
    const real = changes.filter(x => x[1] !== 'added' || x[2] !== 'New cluster');
    const apply = () => {
      const at = new Date().toISOString();
      Object.keys(inc).forEach(c => {
        const x = P.inventory.clusters[c] = P.inventory.clusters[c] || { rows: [], hosts: [], zone: '' };
        if (inc[c].rows) x.rows = inc[c].rows;
        if (inc[c].hosts) x.hosts = inc[c].hosts;
        x.importedAt = at; x.file = [...new Set(inc[c].file)].join(', ');
      });
      P.inventory.history.push({ at, clusters: Object.keys(inc), changes: real.length, files: fileNames });
      touch(); say('Inventory imported for: ' + Object.keys(inc).join(', ') + '.' + note, warn);
    };
    if (!real.length) { apply(); return; }
    const tag = { added: 't-ok', removed: 't-bad', changed: 't-warn' };
    openDialog('<h2>Inventory changes</h2><p>The new export is not the same as the inventory in the project. Examine the changes. ' +
      'After you apply them, the checks show the drafts that need an update. Use <b>Sync from inventory</b> on each VDS.</p>' +
      '<div class="tbl"><table><tr><th>Cluster</th><th>Change</th><th>Item</th><th>Detail</th></tr>' +
      real.map(x => `<tr><td>${esc(x[0])}</td><td><span class="tag ${tag[x[1]]}">${x[1]}</span></td><td>${esc(x[2])}</td><td>${esc(x[3])}</td></tr>`).join('') +
      '</table></div><div class="btns"><button class="btn" data-act="dlg-cancel">Cancel</button><button class="btn pri" data-act="dlg-ok">Apply ' + real.length + ' changes</button></div>', apply);
  }
  let wbPending = null;
  const WB_USE = { vHost: 'Clusters, datacenters, ESXi versions and the vCenter name', vSwitch: 'Standard switches and their MTU', vPort: 'Port groups, VLANs, security and teaming (necessary)',
    vNIC: 'Uplinks and NIC speeds', vSC_VMK: 'VMkernel port groups', dvSwitch: 'Datacenter of each existing VDS', dvPort: 'Port group names that existing VDS already use' };
  async function importWorkbook(books, sheetFiles, fileNames) {
    const S = {}, from = {}, empty = [];
    const addSheet = (k, rows, name) => { S[k] = (S[k] || []).concat(rows); (from[k] = from[k] || []).push(name); };
    try {
      for (const f of books) {
        const r = await readWorkbook(new Uint8Array(await f.arrayBuffer()), f.name);
        Object.keys(r.sheets).forEach(k => addSheet(k, r.sheets[k], f.name));
        if (!Object.keys(r.sheets).length) empty.push(f.name);
      }
      sheetFiles.forEach(([f, k, rows]) => addSheet(k, rows, f.name));
    } catch (e) { say(e.message, true); return; }
    const c = convertWorkbook(S);
    if (empty.length) c.notes.unshift(['warn', 'No sheet that the planner uses in: ' + empty.join(', ') + '.']);
    wbPending = { c, from, counts: Object.fromEntries(WB_SHEETS.map(k => [k, (S[k] || []).length])), fileNames };
    workbookDialog();
  }
  const projectUsed = () => Object.keys(P.inventory.clusters).length > 0 || P.drafts.some(d => d.vds.length || d.versions.length);
  function workbookDialog() {
    const { c, from, counts, fileNames } = wbPending, blocks = c.notes.filter(n => n[0] === 'block'), tagOf = { block: 't-bad', warn: 't-warn', info: 't-info' };
    const otherVc = projectUsed() && P.vcenter && c.vcenter && P.vcenter.toLowerCase() !== c.vcenter.toLowerCase();
    const site = projectUsed() && P.site ? P.site : fileNames[0].replace(/\.(xlsx|csv)$/i, '').replace(/[_-]?tab(v\w+)$/i, '').trim();
    const nHosts = new Set(c.hosts.map(h => h.Host.toLowerCase())).size;
    openDialog('<h2>Inventory workbook</h2>' +
      `<p>Read from: ${esc(fileNames.join(', '))}. vCenter: <b>${esc(c.vcenter || 'not in the input')}</b>. The planner reads the file on this computer. It sends nothing.</p>` +
      '<div class="stats">' + [[c.clusters.length, 'clusters'], [nHosts, 'hosts in the plan'], [c.switches, 'switches to convert'], [c.plan.length, 'port groups'], [c.existingVds, 'existing VDS'], [c.existing.length, 'existing VDS port groups']]
        .map(x => `<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('') + '</div>' +
      '<div class="lbl">Sheets</div><div class="tbl"><table><tr><th>Sheet</th><th>Status</th><th>Rows</th><th>The planner uses it for</th></tr>' +
      WB_SHEETS.map(k => `<tr><td><code>${k}</code></td><td>${from[k] ? '<span class="tag t-ok">found</span>' : '<span class="tag t-warn">missing</span>'}</td><td>${counts[k] || '-'}</td><td>${esc(WB_USE[k])}</td></tr>`).join('') + '</table></div>' +
      (c.notes.length || !c.switches || otherVc ? '<div class="lbl">Notes</div><div class="checks" style="max-height:none">' +
        (otherVc ? `<div><span class="tag t-bad">block</span><span>${esc('The input is from vCenter ' + c.vcenter + '. This project is for ' + P.vcenter + '. Make a new project for it.')}</span></div>` : '') +
        (!c.switches && !blocks.length ? '<div><span class="tag t-info">info</span><span>No standard switch to convert. The input has only switches that rule V-07 or V-10 removes (for example vSwitchBMC).</span></div>' : '') +
        c.notes.map(n => `<div><span class="tag ${tagOf[n[0]]}">${n[0]}</span><span>${esc(n[1])}</span></div>`).join('') + '</div>' : '') +
      (blocks.length ? '' : `<div class="lbl">Site name (for the file names)</div><input class="wide" type="text" id="wb-site" value="${esc(site)}">` +
        '<p class="m">A new project gets two drafts with one VDS for each standard switch (V-01): one keeps the port group names, one has names that vCenter accepts in a datacenter.</p>') +
      '<div class="btns"><button class="btn" data-act="dlg-cancel">Cancel</button>' +
      (blocks.length ? '' : (projectUsed() && !otherVc ? '<button class="btn" data-act="wb-refresh">Refresh the inventory of this project</button>' : '') +
        `<button class="btn pri" data-act="wb-new">${projectUsed() ? 'New project from the workbook' : 'Make the project'}</button>`) + '</div>');
  }
  function workbookNew() {
    const { c, fileNames } = wbPending, site = ($('#wb-site').value || '').trim() || 'site';
    if (dirty && !confirm('The project has changes that are not saved. Continue?')) return;
    const at = new Date().toISOString();
    P = newProject(); P.site = site; P.vcenter = c.vcenter;
    c.clusters.forEach(cl => {
      P.inventory.clusters[cl] = { importedAt: at, file: fileNames.join(', '), rows: c.plan.filter(r => r.Cluster === cl), hosts: c.hosts.filter(r => r.Cluster === cl), zone: '' };
    });
    P.inventory.history = [{ at, clusters: c.clusters.slice(), changes: 0, files: fileNames }];
    P.inventory.existing = c.existing;
    cur = 0; sel = null; P.drafts[0].name = 'Standard layout (V-01)';
    let fr = null;
    if (c.plan.length) {
      quiet = true;
      try { c.clusters.forEach(cl => switchesOf(cl).forEach(s => addVds(cl, s.newVds))); } finally { quiet = false; }
      const fx = clone(P.drafts[0]); fx.id = newDraft(2).id; fx.name = 'Standard layout (V-01), names fixed';
      fr = fixNames(fx); P.drafts.push(fx);
    }
    cur = -1; projectHandle = null; projectName = ''; savedAt = ''; dirty = true; wbPending = null; resetHistory(); render(); scheduleRecovery();
    openDialog('<h2>Project made from the workbook</h2>' +
      `<div class="done-box">&#10003; ${c.clusters.length} clusters, ${c.switches} switches to convert, ${c.plan.length} port groups, ${c.existing.length} existing VDS port groups. vCenter ${esc(P.vcenter || 'not known: enter it at the top')}.</div>` +
      (fr ? `<p>Two drafts: <b>Standard layout (V-01)</b> keeps the port group names. <b>Standard layout (V-01), names fixed</b> renamed ${fr.dup} port groups with the VLAN and ${fr.pre} with the cluster name, so that the names are unique in each datacenter. Which one to use is a design decision.</p>`
        : '<p>The input has no standard switch to convert. The Environment tab shows the clusters.</p>') +
      '<p><b>Next:</b> save the project file (<code>' + esc(slug(site)) + '.vdsplan.json</code>). Then set the security zone of each cluster and open a draft.</p>' +
      '<div class="btns"><button class="btn" data-act="dlg-cancel">Close</button><button class="btn pri" data-act="save-project">Save the project file</button></div>');
  }
  function workbookRefresh() {
    const { c, from, fileNames } = wbPending, inc = {};
    c.clusters.forEach(cl => { inc[cl] = { rows: c.plan.filter(r => r.Cluster === cl), hosts: c.hosts.filter(r => r.Cluster === cl), file: fileNames.slice() }; });
    if (!P.vcenter && c.vcenter) P.vcenter = c.vcenter;
    wbPending = null; closeDialog();
    applyInventory(inc, from.dvPort ? c.existing : null, fileNames, fileNames, '', false);
  }

  // ---------- workbook import: an inventory workbook (.xlsx) or CSV exports of its sheets ----------
  // the same rules as Export-PlannerInventory.ps1 and ConvertTo-VdsPlanRow (VdsPlan.psm1)
  // WB-BEGIN (tests\Test-PlannerWorkbook.ps1 runs this part with Node.js)
  const WB_SHEETS = ['vHost', 'vSwitch', 'vPort', 'vNIC', 'vSC_VMK', 'dvSwitch', 'dvPort'];
  const WB_SKIP = ['vswitchidracvusb', 'vswitchbmc'];
  const WB_LB = { loadbalance_srcid: 'LoadBalanceSrcId', loadbalance_srcmac: 'LoadBalanceSrcMac', loadbalance_ip: 'LoadBalanceIP', loadbalance_loadbased: 'LoadBalanceLoadBased', failover_explicit: 'ExplicitFailover' };
  const xmlText = s => s.replace(/&(lt|gt|amp|quot|apos|#\d+|#x[0-9a-f]+);/gi, (m, e) => {
    const k = e.toLowerCase();

      const sws = switchesOf(c);
      if (!sws.length) rows.push(`<tr><td>${esc(c)}</td><td>${esc(dcOf(c) || '-')}</td><td>${esc(inv.zone || '-')}</td><td>${hs.length || '-'}</td><td>${esc(minEsxOf(c) || '-')}</td><td colspan="6" class="m">No switch to convert in the inventory.</td></tr>`);
      sws.forEach(s => {
        sw++;
        const cv = coverage(c, s), speeds = [...new Set(inv.hosts.filter(h => h.Switch === s.sw).map(h => h.SpeedMbps))].join(' / ');
        if (cv.inDrafts.length) planned++;
        if (cv.committed.length) done++;
        const partial = s.rows.filter(r => (parseInt(r.HostsWithPortGroup, 10) || 0) < (parseInt(r.HostsWithSwitch, 10) || 0)).length;
        const nUp = s.uplinks.split(/\s+/).filter(Boolean).length;
        const st = cv.committed.length ? '<span class="tag t-ok">committed</span>' : cv.inDrafts.length ? '<span class="tag t-warn">in draft</span>' : '<span class="tag t-bad">not planned</span>';
        rows.push(`<tr><td>${esc(c)}</td><td>${esc(dcOf(c) || '-')}</td><td>${esc(inv.zone || '-')}</td><td>${hs.length || '-'}</td><td>${esc(minEsxOf(c) || '-')}${minEsxOf(c) && verCmp(minEsxOf(c), '8.0.3') < 0 ? ' <span class="tag t-warn">below 8.0.3</span>' : ''}</td><td>${esc(s.sw)} → ${esc(s.newVds)}</td>` +
          `<td>${esc(s.uplinks || 'none')}${speeds ? '<br><span class="m">' + esc(speeds) + ' Mbps</span>' : ''}${nUp < 2 ? ' <span class="tag t-bad">V-02</span>' : ''}</td>` +
          `<td>${s.rows.length}${partial ? ' <span class="tag t-warn">' + partial + ' partial</span>' : ''}${s.deviating ? ' <span class="tag t-warn">V-06</span>' : ''}</td>` +
          `<td>${st}</td><td>${esc(cv.inDrafts.join(', ') || '-')}</td><td>${esc(cv.committed.join(', ') || '-')}</td></tr>`);

    });
    const hist = P.inventory.history.slice(-5).reverse();
    $('#overview').innerHTML =
      '<div class="stats">' + [[cls.length, 'clusters'], [hosts, 'hosts'], [sw, 'switches to convert'], [new Set(P.inventory.existing.map(e => e.Vds)).size, 'existing VDS'], [planned + ' / ' + sw, 'in a draft'], [done + ' / ' + sw, 'in a committed version'], [P.drafts.length, 'drafts']]
        .map(x => `<div class="stat"><b>${x[0]}</b><span>${x[1]}</span></div>`).join('') + '</div>' +
      (cls.length ? '<div class="lbl">Environment map: each standard switch and its plan</div><div class="tbl"><table><tr><th>Cluster</th><th>Datacenter</th><th>Zone</th><th>Hosts</th><th>ESXi</th><th>Switch → new VDS</th><th>Uplinks</th><th>Port groups</th><th>Status</th><th>Drafts</th><th>Committed</th></tr>' +
        rows.join('') + '</table></div>' : '<div class="empty">No inventory. Select Import inventory and select the inventory workbook (.xlsx) of the vCenter: the full workbook, or only its network sheets. CSV exports of the sheets and the CSV files of Export-VssLayout.ps1 also work.</div>') +
      (hist.length ? '<div class="lbl" style="margin-top:16px">Inventory imports</div><div class="tbl"><table><tr><th>Time</th><th>Clusters</th><th>Changes</th><th>Files</th></tr>' +
        hist.map(h => `<tr><td>${esc(h.at.slice(0, 16).replace('T', ' '))}</td><td>${esc(h.clusters.join(', '))}</td><td>${h.changes}</td><td>${esc(h.files.join(', '))}</td></tr>`).join('') + '</table></div>' : '');
  }

  function renderInventory() {
    const d = draft(), cls = Object.keys(P.inventory.clusters).sort();
    const free = cls.reduce((a, c) => a + switchesOf(c).filter(s => !usedIn(d, c, s.newVds)).length, 0);
    $('#inventory').innerHTML = '<div class="lbl">Inventory (read only)</div>' +
      (cls.length ? '<div class="ro" style="margin-bottom:8px">Drag a switch onto a VDS to put more clusters on one VDS, or to move a cluster to another VDS.</div>' : '') +
      (free ? `<div class="btns" style="margin:0 0 8px"><button class="btn small" data-act="add-all">Add all ${free} switches (one VDS each, V-01)</button></div>` : '') +
      (P.inventory.existing.length ? `<div class="ro" style="margin-bottom:8px">Existing VDS port groups in the vCenter: ${P.inventory.existing.length}</div>` : '') +
      (cls.length ? cls.map(c => {
      const inv = P.inventory.clusters[c], hs = hostsOf(c);
      return `<div class="inv-cl"><div class="hd"><b>${esc(c)}</b><small title="${esc(inv.file)}">${hs.length ? hs.length + ' hosts' : 'no hosts file'}</small>` +
        `<select data-f="zone" data-c="${esc(c)}" title="Security zone (V-08)">${ZONES.map(z => `<option value="${z}"${z === inv.zone ? ' selected' : ''}>${z || 'zone?'}</option>`).join('')}</select></div>` +

            `<button class="btn small" data-act="add-vds" data-c="${esc(c)}" data-s="${esc(s.newVds)}"${used ? ' disabled title="In ' + esc(used.name) + '"' : ''}>${used ? 'Added' : 'Add'}</button></div>`;
        }).join('') + '</div>';
    }).join('') : '<div class="empty">No inventory. Select Import inventory and select the inventory workbook (.xlsx) of the vCenter, or the CSV files of Export-VssLayout.ps1.</div>');
  }

  // ---------- draft: one topology diagram for each VDS, like the switch view of the vSphere Client ----------
  // port groups on the left, a bus in the middle, the uplinks on the right
  const folded = new Set(), hostsOpen = new Set();
  let pgFilter = '';
  const foldKey = (d, vi) => d.id + '|' + vi;
  const natCmp = (a, b) => a.localeCompare(b, 'en', { numeric: true, sensitivity: 'base' });
  // the physical adapter of each host on each uplink, as Move-HostToVds.ps1 moves them:
  // stage 1 moves the first uplink (vmnic1) to dvUplink1, stage 2 the other adapters in sequence
  function uplinkMap(v) {
    const ups = uplinkNames(v.uplinkCount), rows = [];
    v.members.forEach(m => {
      const hs = ((P.inventory.clusters[m.cluster] || {}).hosts || []).filter(h => h.Switch === m.sourceSwitch);
      const list = hs.length ? hs.map(h => ({ host: h.Host, nics: (h.Uplinks || '').split(/\s+/).filter(Boolean) })) : [{ host: '', nics: (m.uplinks || '').split(/\s+/).filter(Boolean) }];
      list.forEach(x => {
        const sorted = x.nics.slice().sort(natCmp), first = sorted.includes('vmnic1') ? 'vmnic1' : sorted[0];
        const order = first ? [first].concat(sorted.filter(n => n !== first)) : [];
        rows.push({ cluster: m.cluster, host: x.host, nic: ups.map((u, i) => order[i] || '') });
      });
    });
    return { ups, rows };
  }
  function pgMatch(p) {
    if (!pgFilter) return true;
    const f = pgFilter.toLowerCase(), vl = p.vlanType === 'vlan' ? String(p.vlan) : p.vlanType === 'trunk' ? 'trunk ' + p.trunk : 'none';
    return p.name.toLowerCase().includes(f) || (p.source || '').toLowerCase().includes(f) || vl.includes(f);
  }
  function renderDraft() {
    const d = draft();
    $('#draft').innerHTML = `<div class="lbl">${esc(d.name)}: new VDS, port groups and uplinks</div>` +
      (d.vds.length ? '<div class="btns draft-tools"><input type="text" id="pg-filter" placeholder="Filter port groups (name or VLAN)" value="' + esc(pgFilter) + '">' +
        '<button class="btn small" data-act="unfold-all">Expand all</button><button class="btn small" data-act="fold-all">Collapse all</button>' +
        '<button class="btn small" data-act="fix-names" title="Same name with different VLANs on one VDS: add the VLAN. Name on more than one VDS of a datacenter: add the cluster name in front.">Fix names</button></div>' : '') +
      '<div id="vds-list"></div>';

  }
  function renderVdsList() {

  // the Uplinks box stays below the VDS name bar, also when the bar uses two lines

  function topology(d, v, vi) {
    const isSel = sel && sel.v === vi, shared = v.members.length > 1, fold = folded.has(foldKey(d, vi));
    const open = v.portGroups.filter(p => p.include && p.partial && !p.trunkConfirmed).length;
    const shown = v.portGroups.map((p, pi) => [p, pi]).filter(x => pgMatch(x[0]));
    const selPg = isSel && sel.p !== null ? v.portGroups[sel.p] : null;
    let h = `<div class="vds topo${isSel && sel.p === null && sel.k === null ? ' sel' : ''}" data-vi="${vi}"><div class="vds-h" data-act="sel-vds" data-v="${vi}">` +
      `<button class="fold" data-act="fold" data-v="${vi}" aria-expanded="${!fold}">${fold ? '&#9656;' : '&#9662;'}</button><b>${esc(v.name)}</b>` +

      `<button class="btn small" data-act="add-pg" data-v="${vi}">+ Port group</button><button class="btn small" data-act="add-vmk" data-v="${vi}">+ VMkernel</button>` +
      `<button class="btn small" data-act="share" data-v="${vi}">+ Cluster</button><button class="btn small" data-act="del-vds" data-v="${vi}">Remove</button></div>`;
    if (fold) return h + '</div>';
    // left: the port groups, each with a wire to the bus
    h += '<div class="topo-b"><div class="pgs">' + (shown.length ? shown.map(([p, pi]) => {
      const vl = p.vlanType === 'vlan' ? 'VLAN ID: ' + p.vlan : p.vlanType === 'trunk' ? 'VLAN trunk: ' + p.trunk : 'VLAN: none';
      const ports = p.binding === 'ephemeral' ? 'Ephemeral binding' : p.ports + ' ports, ' + p.allocation;

        `<div class="pgn"><i class="ico-pg"></i>${esc(p.name)}${p.include && p.partial && !p.trunkConfirmed ? '<span class="tag t-bad">V-05</span>' : ''}${p.include ? '' : '<span class="tag t-warn">not created</span>'}</div>` +
        `<div class="pgm">${esc(vl)} · ${esc(ports)}</div>` +

        '</div><span class="wire"></span></div>';
    }).join('') : '<div class="empty">No port group matches the filter.</div>') +
      v.vmkernel.map((k, ki) => [k, ki]).filter(x => !v.portGroups.some(p => p.name === x[0].portGroup)).map(([k, ki]) =>
        `<div class="pgrow"><div class="pgbox vmkonly${isSel && sel.k === ki ? ' sel' : ''}" role="button" tabindex="0" data-act="sel-vmk" data-v="${vi}" data-k="${ki}"><div class="pgn">New VMkernel port: ${esc(k.service)}</div><div class="pgm">Select a port group for it</div></div><span class="wire"></span></div>`).join('') +
      '</div>';
    // right: the uplinks, with the physical adapters of each host
    const um = uplinkMap(v);
    h += '<div class="ups"><div class="upbox"><div class="uph"><i class="ico-up"></i>Uplinks</div>' + um.ups.map((u, i) => {
      const st = selPg ? (selPg.active.includes(u) ? 'act' : selPg.standby.includes(u) ? 'stb' : 'unu') : '';
      const cnt = {}; um.rows.forEach(r => { const n = r.nic[i] || 'none'; cnt[n] = (cnt[n] || 0) + 1; });
      const nics = Object.keys(cnt).sort(natCmp).map(n => um.rows.length > 1 || um.rows[0].host ? n + ' (' + cnt[n] + ')' : n).join(', ');
      return `<div class="uprow ${st}"><span class="upn">${u}</span>${st ? `<span class="tag ${st === 'act' ? 't-ok">Active' : st === 'stb' ? 't-warn">Standby' : 't-info">Unused'}</span>` : ''}<small>${esc(nics)}</small></div>`;
    }).join('') +
      (um.rows.some(r => r.host) ? `<details class="uphosts" data-k="${esc(foldKey(d, vi))}"${hostsOpen.has(foldKey(d, vi)) ? ' open' : ''}><summary>Physical adapters of ${um.rows.length} hosts</summary><table><tr><th>Host</th>${um.ups.map(u => '<th>' + u.replace('dvUplink', 'U') + '</th>').join('')}</tr>` +
        um.rows.map(r => `<tr><td>${esc(r.host)}</td>${r.nic.map(n => '<td>' + esc(n || '-') + '</td>').join('')}</tr>`).join('') + '</table><p class="m">After Move-HostToVds.ps1: stage 1 moves vmnic1 to dvUplink1, stage 2 the other adapters.</p></details>' : '') +
      '</div></div></div></div>';
    return h;
  }

  const opt = (list, val) => list.map(o => {
    const [v, t] = Array.isArray(o) ? o : [o, o];
    return `<option value="${esc(v)}"${v === val ? ' selected' : ''}>${esc(t)}</option>`;
  }).join('');
  let editorKey = '';
  function renderEditor() {
    const d = draft(), el = $('#editor');

    const key = sel ? [cur, sel.v, sel.p, sel.k].join('|') : '';

    if (!sel || !d.vds[sel.v]) { el.innerHTML = '<div class="lbl">Settings</div><div class="empty">Select a VDS, a port group or a VMkernel adapter.</div>'; return; }
    const v = d.vds[sel.v];
    if (sel.k !== null && v.vmkernel[sel.k]) { renderVmkEditor(el, v, v.vmkernel[sel.k]); return; }
    if (sel.p === null || !v.portGroups[sel.p]) {
      el.innerHTML = '<div class="lbl">VDS</div>' +
        `<div class="lbl">Name</div><input class="wide" type="text" data-f="v.name" value="${esc(v.name)}">` +
        `<div class="row2"><div><div class="lbl">Version</div><select class="wide" data-f="v.version">${opt(['8.0.3', '8.0.0'], v.version)}</select></div>` +
        `<div><div class="lbl">MTU</div><input class="wide" type="number" min="1280" max="9000" data-f="v.mtu" value="${v.mtu}"></div></div>` +
        '<div class="lbl">Clusters and standard switches (from inventory)</div><div class="tbl"><table><tr><th>Cluster</th><th>Switch</th><th>Uplinks</th><th>Zone</th></tr>' +
        v.members.map((m, mi) => `<tr><td>${esc(m.cluster)}</td><td>${esc(m.sourceSwitch)}</td><td>${esc(m.uplinks)}</td><td>${esc((P.inventory.clusters[m.cluster] || {}).zone || '-')}</td></tr>` +
          `<tr><td colspan="4" class="mem-act"><select data-f="m.move" data-m="${mi}"><option value="">Move ${esc(m.cluster)} to...</option>` +
          d.vds.map((x, xi) => x === v ? '' : `<option value="${xi}">${esc(x.name)} (${esc(clustersOf(x).join(', '))})</option>`).join('') +
          (v.members.length > 1 ? '<option value="own">A VDS of its own</option>' : '') + '</select>' +
          (v.members.length > 1 ? ` <button class="btn small" data-act="del-member" data-m="${mi}">Remove</button>` : '') + '</td></tr>').join('') + '</table></div>' +
        (v.members.length > 1 ? (() => {
          const s = sharedState(v), acc = s.soft.filter(t => !s.open.includes(t));
          return '<div class="lbl">VDS for more than one cluster (V-08)</div><div class="checks" style="max-height:none">' +
            s.hard.map(t => `<div><span class="tag t-bad">block</span><span>${esc(t)}</span></div>`).join('') +
            s.open.map(t => `<div><span class="tag t-bad">accept</span><span>${esc(t)}</span></div>`).join('') +
            acc.map(t => `<div><span class="tag t-warn">accepted</span><span>${esc(t)}</span></div>`).join('') +
            (!s.hard.length && !s.soft.length ? '<div><span class="tag t-ok">same</span><span>The standard switches are the same.</span></div>' : '') + '</div>' +
            (s.open.length && !s.hard.length ? '<div class="btns"><button class="btn small" data-act="v08-accept">Accept the differences</button></div>' : '');
        })() : '') +
        (v.members.some(m => m.deviating) ? '<div class="ro" style="margin-top:6px">Different layout: ' + esc(v.members.filter(m => m.deviating).map(m => m.cluster + ': ' + m.deviating).join(' · ')) + '</div>' : '') +
        (() => {
          const part = v.portGroups.filter(p => p.include && p.partial), open = part.filter(p => !p.trunkConfirmed).length;
          return part.length ? `<div class="lbl">VLAN trunk check (V-05)</div><div class="ro">${part.length} port groups are not on all hosts of the cluster. ${open} are not confirmed.</div>` +
            `<label class="chk"><input type="checkbox" data-f="v.trunkAll"${open ? '' : ' checked'}> The network team confirmed the VLAN trunk of all ${part.length} port groups on the uplinks of all hosts</label>` : '';
        })() +
        '<div class="lbl">Design defaults (V-09)</div><div class="ro">LLDP in both directions. Teaming route based on originating virtual port. ' + v.uplinkCount + ' uplinks from the inventory.</div>' +
        `<div class="btns"><button class="btn small" data-act="share" data-v="${sel.v}">+ Cluster (shared VDS)</button><button class="btn small" data-act="sync" data-v="${sel.v}">Sync from inventory</button><button class="btn small" data-act="prefix" data-v="${sel.v}">Add a name prefix</button></div>` +
        '<div class="lbl">Datacenter and ESXi (from inventory)</div><div class="ro">' + v.members.map(m => esc(m.cluster) + ': ' + esc(dcOf(m.cluster) || 'datacenter not known') + ', lowest ESXi ' + esc(minEsxOf(m.cluster) || 'not known')).join('<br>') + '</div>';
      return;
    }
    const p = v.portGroups[sel.p], ups = uplinkNames(v.uplinkCount);
    let h = '<div class="lbl">Port group</div>' +
      `<label class="chk"><input type="checkbox" data-f="p.include"${p.include ? ' checked' : ''}> Create this port group on the VDS</label>` +
      `<div class="lbl">Name on the VDS</div><input class="wide" type="text" data-f="p.name" value="${esc(p.name)}">`;
    if (p.source) h += `<div class="lbl">From inventory (fixed)</div><div class="ro">Standard port group: ${esc(p.source)}<br>VLAN: ${p.sourceVlan}${p.flags ? '<br>' + esc(p.flags) : ''}</div>`;
    if (p.partial) h += `<label class="chk"><input type="checkbox" data-f="p.trunkConfirmed"${p.trunkConfirmed ? ' checked' : ''}> The network team confirmed the VLAN on the uplinks of all hosts (V-05)</label>`;
    h += `<div class="row2"><div><div class="lbl">VLAN type</div><select class="wide" data-f="p.vlanType">${opt([['none', 'None'], ['vlan', 'VLAN'], ['trunk', 'VLAN trunking']], p.vlanType)}</select></div>`;
    h += p.vlanType === 'vlan' ? `<div><div class="lbl">VLAN ID</div><input class="wide" type="number" min="1" max="4094" data-f="p.vlan" value="${p.vlan}"></div>`
      : p.vlanType === 'trunk' ? `<div><div class="lbl">Trunk range</div><input class="wide" type="text" data-f="p.trunk" value="${esc(p.trunk)}"></div>` : '<div></div>';

  function renderVmkEditor(el, v, k) {

      case 'rename-draft': { const d = draft(); if (!d) return true; const n = prompt('Draft name:', d.name); if (n && n.trim()) { d.name = n.trim(); touch(); } return true; }
      case 'show-checks': if (cur >= 0) pulse($('#checks')); return true;

      case 'toggle-tips': tipsOn = !tipsOn; store.set('tips', tipsOn ? 'on' : 'off'); say('Help bubbles ' + (tipsOn ? 'on.' : 'off.')); return true;
      case 'shortcuts': shortcutsDialog(); return true;
      case 'about': aboutDialog(); return true;
      case 'feedback': feedbackDialog(); return true;
      case 'fb-copy': { const f = feedbackData(); if (!f) return true; copyText(feedbackText(f)); return true; }
      case 'fb-open': {
        const f = feedbackData(); if (!f || !FEEDBACK_URL) return true;
        const q = new URLSearchParams({ title: '[Feedback] ' + f.title, type: f.type, area: f.area, rating: f.rating, details: f.text.slice(0, 5000), contact: f.contact, version: f.version, browser: f.browser });

        closeDialog(); say('The feedback form opened in a new tab. Check the text and submit it there.'); return true;
      }
      case 'open-doc': if (!window.open('../docs/' + t.dataset.doc, '_blank')) say('Open docs\\' + t.dataset.doc + ' in the toolkit folder.', true); return true;
      case 'rec-restore': {
        const r = recovery; closeDialog(); if (!r) return true;
        P = normalize(JSON.parse(r.text)); cur = -1; sel = null; projectHandle = null; projectName = r.name || ''; savedAt = ''; dirty = true;
        resetHistory(); render(); say('Work restored. Save the project to keep it' + (r.name ? ' (Save as, to select ' + r.name + ' again).' : '.')); return true;
      }
      case 'rec-discard': kvDel('recovery'); recovery = null; closeDialog(); return true;
    }
    return false;
  }

  // ---------- events ----------
  document.addEventListener('click', e => {
    const t = e.target.closest('[data-act]'); if (!t || t.disabled) return;
    if (openMenuId && t.dataset.act !== 'menu') closeMenus();
    if (t.dataset.act === 'clear-recent') { recentCache = []; kvSet('recent', []); say('Recent list cleared.'); return; }
    const a = t.dataset.act;
    if (a === 'dlg-cancel') { closeDialog(); return; }
    if (a === 'dlg-ok') { const ok = dialogOk; closeDialog(); if (ok) ok(); return; }
    if (a === 'help') { endTour(); helpDialog(); return; }
    if (a === 'tour') { tour(0); return; }
    if (a === 'tour-next') { tour(tourI + 1); return; }
    if (a === 'tour-back') { tour(tourI - 1); return; }
    if (a === 'tour-end') { endTour(); return; }
    if (a === 'step' || a === 'next') { goStep(+t.dataset.n); return; }
    if (a === 'commit') { commitDialog(); return; }
    if (a === 'commit-ok') { commitOk(); return; }
    if (a === 'wb-new') { workbookNew(); return; }
    if (a === 'wb-refresh') { workbookRefresh(); return; }
    if (a === 'run') { runDialog(draft(), +t.dataset.i, null); return; }
    if (a === 'view-file') { viewFile(+t.dataset.x); return; }
    if (a === 'back-run') { runDialog(lastRun.d, lastRun.i, lastRun.where); return; }
    if (a === 'open-report') {
      const f = packageFiles(lastRun.d, lastRun.d.versions[lastRun.i])[3];
      const w = window.open(URL.createObjectURL(new Blob([f.text], { type: 'text/html' })), '_blank');
      if (!w) say('The browser blocked the new tab. Open the report file from the package folder.', true);
      return;
    }
    if (a === 'copy') { copyText($('#' + t.dataset.c).textContent); return; }
    if (a === 'copy-all') { copyText(runCommands(lastRun.d.versions[lastRun.i], JSON.parse(lastRun.d.versions[lastRun.i].text)).map(c => '# ' + c[0] + '\r\n' + c[1]).join('\r\n\r\n')); return; }
    if (a === 'tab') { cur = +t.dataset.i; sel = null; render(); return; }
    if (a === 'new-draft') { P.drafts.push(newDraft(P.drafts.length + 1)); cur = P.drafts.length - 1; sel = null; touch(); return; }
    if (a === 'save-project') { closeDialog(); saveProject(); return; }
    if (a === 'open-project') { pickProject(); return; }
    if (a === 'new-project') { if (leaveOk()) closeProject('New project. Select Import inventory and select the inventory workbook or CSV files.'); return; }
    if (shellAct(a, t)) return;
    if (a === 'import') { $('#f-inventory').click(); return; }
    if (a === 'selftest') { if (!dirty || confirm('The self-test clears the planner. Changes that are not saved are lost. Continue?')) selfTest(); return; }

    const d = draft(); if (!d) return;
    const vi = t.dataset.v !== undefined ? +t.dataset.v : sel ? sel.v : null, v = vi !== null ? d.vds[vi] : null;
    if (['del-vds', 'add-pg', 'add-vmk', 'share', 'fold'].includes(a)) e.stopPropagation();
    switch (a) {
      case 'del-draft':
        if (P.drafts.length === 1) { say('A project has one draft or more.', true); return; }
        if (!confirm('Delete draft "' + d.name + '" and its ' + d.versions.length + ' committed versions from the project?')) return;
        P.drafts.splice(cur, 1); cur = -1; sel = null; touch(); break;
      case 'dup-draft': {
        const c = clone(d); c.id = newDraft(P.drafts.length + 1).id; c.name = 'Copy of ' + d.name; c.versions = [];
        P.drafts.push(c); cur = P.drafts.length - 1; sel = null; touch(); say('Draft copied. The copy has no committed version.'); break;
      }
      case 'add-vds': addVds(t.dataset.c, t.dataset.s); break;
      case 'fix-names': {
        if (!confirm('Rename port groups in ' + d.name + '? Same name with different VLANs on one VDS gets the VLAN at the end. A name on more than one VDS of a datacenter gets the cluster name in front. The VM moves use the new names.')) return;
        const r = fixNames(d); touch(); say(r.dup + ' port groups renamed with the VLAN, ' + r.pre + ' with the cluster name. Examine the names.'); break;
      }
      case 'add-all': {
        let k = 0;
        quiet = true;
        try { Object.keys(P.inventory.clusters).sort().forEach(c => switchesOf(c).forEach(x => { if (!usedIn(d, c, x.newVds)) { addVds(c, x.newVds); k++; } })); } finally { quiet = false; }
        sel = null; touch(); say(k + ' VDS added to ' + d.name + '. Examine the checks.'); break;
      }
      case 'del-vds': if (confirm('Remove ' + v.name + ' from this draft?')) { d.vds.splice(vi, 1); sel = null; touch(); } break;
      case 'fold': { const k = foldKey(d, vi); if (folded.has(k)) folded.delete(k); else folded.add(k); renderVdsList(); break; }
      case 'fold-all': d.vds.forEach((x, i) => folded.add(foldKey(d, i))); renderVdsList(); break;

      ok('Self-test ran to the end', false, e.stack || e.message);
    } finally {
      window.prompt = keep.prompt; window.confirm = keep.confirm; captureFiles = null; $('#committer').value = '';
      P = newProject(); cur = -1; sel = null; dirty = false; projectName = ''; resetHistory(); render();
    }
    const pass = res.filter(x => x[1]).length;
    window.__selftest = { pass, total: res.length, results: res };
    document.title = 'Self-test: ' + pass + ' of ' + res.length + ' passed';
    openDialog(`<h2>Self-test: ${pass} of ${res.length} passed</h2><p>The self-test uses made-up data in memory. It wrote no file. The planner is empty again.</p>` +
      '<div class="tbl"><table><tr><th>Result</th><th>Test</th><th>Detail</th></tr>' +
      res.map(x => `<tr><td><span class="tag ${x[1] ? 't-ok">pass' : 't-bad">fail'}</span></td><td>${esc(x[0])}</td><td>${x[1] ? '' : esc(x[2])}</td></tr>`).join('') +
      '</table></div><div class="btns"><button class="btn" data-act="dlg-cancel">Close</button></div>');
  }
  const hex = buf => Array.from(new Uint8Array(buf), b => ('0' + b.toString(16)).slice(-2)).join('');

  P = newProject();
  applyTheme(store.get('theme') || 'system');
  document.documentElement.classList.toggle('no-brand', !brandOn());
  renderMenus(); resetHistory(); render();
  if (location.hash === '#selftest') selfTest();
  else (async () => { await loadRecent(); if (!projectUsed()) render(); await offerRecovery(); })();
})();
</script>
</body>
</html>
